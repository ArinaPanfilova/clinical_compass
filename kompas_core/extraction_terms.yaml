# Словари для извлечения сведений из медицинских документов (kompas_core/extraction.py).
#
# Термины добавляются здесь, без правки кода. Регулярные выражения применяются к тексту,
# приведённому к нижнему регистру, с «ё» → «е». Поэтому шаблоны пишутся строчными и через «е».
# При перекрытии совпадений побеждает более длинное.
#
# Статус словаря: черновик проекта. Соответствие названий кодам МКБ-10 и состав групп
# утверждает клинический лид (как и словарь фраз дневника в text_screen.py).

version: "0.1"

# Порядок ключей = порядок в выходе; ключи — как в safety_profile карточки Авиандра
safety_keys:
  - epilepsy_or_organic_brain_lesion
  - pregnancy
  - breastfeeding
  - renal_gfr_below_60
  - hepatic_insufficiency
  - maoi_within_2_weeks
  - cardiovascular_disease
  - endocrine_disorder
  - substance_dependence
  - lactose_intolerance
  - hypersensitivity_aviandr

# --- Диагнозы по названию → код МКБ-10 ----------------------------------------------------------
# Если рядом в тексте стоит код, берётся код из текста. Факты безопасности выводятся из кода (icd_safety).
diagnoses:
  # Психиатрические
  - {code: F41.1, re: ['генерализованн\w*\s+тревожн\w*\s+(?:расстройств\w*|р-в\w*)',
                       'тревожн\w*\s+(?:расстройств\w*|р-в\w*)\s+генерализованн\w*(?:\s+тип\w*)?',
                       '\bгтр\b']}
  - {code: F41.2, re: ['смешанн\w*\s+тревожн\w*(?:\s+и\s+|\s*-\s*)депрессивн\w*\s+(?:расстройств\w*|р-в\w*)',
                       'тревожно-депрессивн\w*\s+(?:расстройств\w*|р-в\w*)']}
  - {code: F41.0, re: ['паническ\w*\s+(?:расстройств\w*|р-в\w*)',
                       'эпизодическ\w*\s+пароксизмальн\w*\s+тревожност\w*']}
  - {code: F41.9, re: ['тревожн\w*\s+(?:расстройств\w*|р-в\w*),?\s+неуточненн\w*']}
  - {code: F32.0, re: ['легк\w*\s+депрессивн\w*\s+эпизод\w*',
                       'депрессивн\w*\s+эпизод\w*,?\s+легк\w*(?:\s+(?:степени|ст\.?))?(?:\s+тяжести)?']}
  - {code: F32.1, re: ['умеренн\w*\s+депрессивн\w*\s+эпизод\w*',
                       'депрессивн\w*\s+эпизод\w*,?\s+(?:средн\w*|ср\.|умеренн\w*)\s*(?:степени|ст\.?)?(?:\s+тяжести)?']}
  - {code: F32.2, re: ['тяжел\w*\s+депрессивн\w*\s+эпизод\w*',
                       'депрессивн\w*\s+эпизод\w*,?\s+тяжел\w*(?:\s+(?:степени|ст\.?))?(?:\s+тяжести)?']}
  - {code: F32.9, re: ['депрессивн\w*\s+эпизод\w*']}
  - {code: F33.0, re: ['(?:рекуррентн\w*\s+депрессивн\w*\s+(?:расстройств\w*|р-в\w*)|\bрдр\b),?\s*(?:текущ\w*\s+)?(?:эпизод\w*\s+)?легк\w*(?:\s*(?:степени|ст\.?))?(?:\s+тяжести)?']}
  - {code: F33.1, re: ['(?:рекуррентн\w*\s+депрессивн\w*\s+(?:расстройств\w*|р-в\w*)|\bрдр\b),?\s*(?:текущ\w*\s+)?(?:эпизод\w*\s+)?(?:средн\w*|ср\.|умеренн\w*)(?:\s*(?:степени|ст\.?))?(?:\s+тяжести)?']}
  - {code: F33.2, re: ['(?:рекуррентн\w*\s+депрессивн\w*\s+(?:расстройств\w*|р-в\w*)|\bрдр\b),?\s*(?:текущ\w*\s+)?(?:эпизод\w*\s+)?тяжел\w*(?:\s*(?:степени|ст\.?))?(?:\s+тяжести)?']}
  - {code: F33.9, re: ['рекуррентн\w*\s+депрессивн\w*\s+(?:расстройств\w*|р-в\w*)', '\bрдр\b']}
  - {code: F43.2, re: ['(?:расстройств\w*|р-в\w*|нарушени\w*)\s+адаптаци\w*',
                       'расстройств\w*\s+приспособительн\w*\s+реакци\w*', 'адаптационн\w*\s+расстройств\w*']}
  - {code: F43.0, re: ['остр\w*\.?\s+реакци\w*\s+на\s+стресс\w*']}
  - {code: F43.1, re: ['посттравматическ\w*\s+стрессов\w*\s+расстройств\w*', '\bптср\b']}
  - {code: F40.1, re: ['социальн\w*\s+фоби\w*']}
  # Сердечно-сосудистые
  - {code: I11.9, re: ['(?:гипертоническ\w*\s+болезн\w*|\bгб\b)\s*,?\s*(?:ii|iii|2|3)(?:-?\s*(?:й|ей))?\s*(?:ст\.?|стади\w*)?(?![\w.,])',
                       '(?:гипертоническ\w*\s+болезн\w*|\bгб\b)\s*,?\s*(?:ст\.?|стади\w*)\s*(?:ii|iii|2|3)\b']}
  - {code: I10, re: ['(?:гипертоническ\w*\s+болезн\w*|\bгб\b)\s*,?\s*(?:i|1)(?:-?\s*(?:й|ей))?\s*(?:ст\.?|стади\w*)',
                     'гипертоническ\w*\s+болезн\w*', '\bгб\b', 'артериальн\w*\s+гипертензи\w*',
                     'эссенциальн\w*\s+(?:артериальн\w*\s+)?гипертензи\w*', '\bаг\b', 'гипертони(?:я|и|ей|ю)\b']}
  - {code: I25.9, re: ['(?:хроническ\w*\s+)?ишемическ\w*\s+болезн\w*\s+сердца', '\bибс\b']}
  - {code: I25.2, re: ['постинфарктн\w*\s+кардиосклероз\w*', '\bпикс\b', 'перенесенн\w*\s+инфаркт\w*\s+миокарда',
                       'инфаркт\w*\s+миокарда\s+в\s+анамнезе']}
  - {code: I48, re: ['фибрилляци\w*\s+предсерди\w*', '\bфп\b', 'мерцательн\w*\s+аритми\w*', 'трепетани\w*\s+предсерди\w*']}
  - {code: I50.9, re: ['хроническ\w*\s+сердечн\w*\s+недостаточност\w*', '\bхсн\b']}
  # Эндокринные
  - {code: E11.9, re: ['сахарн\w*\s+диабет\w*\s*,?\s*(?:2|ii|второго)(?:-?\s*го)?\s*(?:тип\w*|т\.)',
                       '\bсд\s*(?:2|ii)(?:-?\s*го)?(?:\s*(?:тип\w*|т\.))?',
                       '(?:сахарн\w*\s+диабет\w*|\bсд)\s*,?\s*тип\w*\s*(?:2|ii)\b']}
  - {code: E10.9, re: ['сахарн\w*\s+диабет\w*\s*,?\s*(?:1|i|первого)(?:-?\s*го)?\s*(?:тип\w*|т\.)',
                       '\bсд\s*(?:1|i)(?:-?\s*го)?(?:\s*(?:тип\w*|т\.))?(?![\w])',
                       '(?:сахарн\w*\s+диабет\w*|\bсд)\s*,?\s*тип\w*\s*(?:1|i)\b']}
  - {code: E14.9, re: ['сахарн\w*\s+диабет\w*', '\bсд\b']}
  - {code: E03.9, re: ['гипотиреоз\w*']}
  - {code: E05.9, re: ['тиреотоксикоз\w*', 'гипертиреоз\w*']}
  - {code: E06.3, re: ['аутоиммунн\w*\s+тиреоидит\w*', '\bаит\b']}
  - {code: E04.9, re: ['(?:узлов\w*|диффузн\w*|многоузлов\w*)\s+(?:нетоксическ\w*\s+)?зоб\w*']}
  # Печень
  - {code: K74.6, re: ['цирроз\w*\s+печени', '\bцп\b(?=[^.;\n]{0,25}(?:child|чайлд))']}
  - {code: K72.1, re: ['(?:хроническ\w*|хр\.)\s*печеночн\w*\s+недостаточност\w*']}
  - {code: K72.9, re: ['печеночн\w*\s+недостаточност\w*', 'печ\.\s*недостаточност\w*']}
  # Головной мозг
  - {code: G40.9, re: ['эпилепси\w*']}
  - {code: T90.5, re: ['последстви\w*\s+(?:\w+\s+){0,2}(?:з?чмт|черепно-мозгов\w*\s+травм\w*)']}
  - {code: G93.8, re: ['(?:резидуальн\w*\s+)?(?:органическ\w*|орг\.)\s*поражени\w*\s+(?:головного\s+мозга|гм|цнс|центральн\w*\s+нервн\w*\s+систем\w*)',
                       'резидуально-органическ\w*\s+(?:поражени\w*|заболевани\w*)(?:\s+(?:головного\s+мозга|гм|цнс))?']}
  - {code: G93.4, re: ['энцефалопати\w*']}
  - {code: I67.8, re: ['дисциркуляторн\w*\s+энцефалопати\w*']}
  # Зависимости
  - {code: F10.2, re: ['(?:синдром\w*\s+)?зависимост\w*\s+от\s+алкогол\w*', 'алкогольн\w*\s+зависимост\w*',
                       'алк\.\s*зависимост\w*', '(?:хроническ\w*\s+)?алкоголизм\w*']}
  - {code: F11.2, re: ['(?:синдром\w*\s+)?зависимост\w*\s+от\s+(?:опиоид\w*|опиат\w*|героин\w*)',
                       'опиоидн\w*\s+зависимост\w*', 'опийн\w*\s+наркомани\w*']}
  - {code: F12.2, re: ['(?:синдром\w*\s+)?зависимост\w*\s+от\s+каннабиноид\w*']}
  - {code: F13.2, re: ['(?:синдром\w*\s+)?зависимост\w*\s+от\s+(?:седативн|снотворн|бензодиазепин)\w*']}
  - {code: F19.2, re: ['наркомани\w*', 'наркотическ\w*\s+зависимост\w*', 'полинаркомани\w*',
                       '(?:синдром\w*\s+)?зависимост\w*\s+от\s+(?:пав|психоактивн\w*\s+веществ\w*)']}
  # Прочее
  - {code: E73.9, re: ['непереносимост\w*\s+лактоз\w*', 'лактазн\w*\s+недостаточност\w*', 'гиполактази\w*']}

# Код МКБ-10 (по началу) → факт безопасности. Значение true, кроме N18.1/N18.2 (СКФ ≥ 60).
icd_safety:
  - {prefix: [G40, G41, G93, T90.5, S06, F06, F07, I67.8], key: epilepsy_or_organic_brain_lesion, value: true}
  - {prefix: [I0, I1, I2, I3, I4, I5, I6, I7], key: cardiovascular_disease, value: true}
  - {prefix: [E0, E1, E20, E21, E22, E23, E24, E25, E26, E27, E28, E29, E3], key: endocrine_disorder, value: true}
  - {prefix: [N18.3, N18.4, N18.5, N19], key: renal_gfr_below_60, value: true}
  - {prefix: [N18.1, N18.2], key: renal_gfr_below_60, value: false}
  - {prefix: [K72, K74.6, K70.3, K70.4, K76.7], key: hepatic_insufficiency, value: true}
  - {prefix: [F10.2, F11.2, F12.2, F13.2, F14.2, F15.2, F16.2, F18.2, F19.2], key: substance_dependence, value: true}
  - {prefix: [E73], key: lactose_intolerance, value: true}
  - {prefix: [Z33, O0, O1, O2, O3, O4, O9], key: pregnancy, value: true}
  - {prefix: [Z39.1], key: breastfeeding, value: true}

# --- Факты безопасности, которые не являются диагнозами ------------------------------------------
# polarity: both — утверждение даёт true, отрицание — false;
#           neg_only — термин общий («заболевания печени»): учитывается только его отрицание.
safety_terms:
  epilepsy_or_organic_brain_lesion:
    - {re: 'судорог\w*|судорожн\w*', polarity: both}
    - {re: 'эпилептическ\w*', polarity: both}
    - {re: '\bз?чмт\b|черепно-мозгов\w*\s+травм\w*|травм\w*\s+(?:головы|головного\s+мозга)', polarity: neg_only}
  pregnancy:
    - {re: 'беременн\w*|\bб-сть\b', polarity: both}
  breastfeeding:
    - {re: 'грудн\w*\s+вскармливани\w*|корм\w*\s+грудью|кормлени\w*\s+грудью|грудью|лактаци\w*|\bгв\b', polarity: both}
  renal_gfr_below_60:
    - {re: 'почечн\w*\s+недостаточност\w*|\bхпн\b', polarity: both}
    - {re: '(?:функци\w*|заболевани\w*|патологи\w*)\s+почек', polarity: neg_only}
  hepatic_insufficiency:
    - {re: '(?:класс\w*\s+)?[abcавс]\s+по\s+(?:чайлд|child)\w*(?:[\s\-–—]*(?:пью|pugh))?', polarity: both}
    - {re: '(?:чайлд|child)[\s\-–—]*(?:пью|pugh)\s*,?\s*(?:класс\w*\s*)?[abcавс]\b', polarity: both}
    - {re: '(?:функци\w*|заболевани\w*|патологи\w*)\s+печени', polarity: neg_only}
  cardiovascular_disease:
    - {re: 'стенокарди\w*|инфаркт\w*\s+миокарда|аритми\w*|порок\w*\s+сердца|кардиомиопати\w*|сердечн\w*\s+недостаточност\w*', polarity: both}
    - {re: '(?:заболевани\w*|патологи\w*)\s+(?:сердечно-сосудист\w*\s+систем\w*|сердца(?:\s+и\s+сосудов)?|ссс)', polarity: neg_only}
    - {re: 'сердечно-сосудист\w*\s+(?:заболевани\w*|патологи\w*)|\bссз\b|кардиологическ\w*\s+(?:анамнез\w*|патологи\w*)', polarity: neg_only}
  endocrine_disorder:
    - {re: '(?:заболевани\w*|патологи\w*)\s+щитовидн\w*\s+желез\w*|эндокринн\w*\s+(?:патологи\w*|заболевани\w*)', polarity: both}
    - {re: 'гиперпролактинеми\w*|акромегали\w*|надпочечников\w*\s+недостаточност\w*', polarity: both}
  substance_dependence:
    - {re: 'злоупотребл\w*\s+(?:алкогол\w*|наркот\w*|пав)|(?:алкогол\w*|наркотик\w*)\s+злоупотребл\w*', polarity: both}
    - {re: 'употреблени\w*\s+(?:алкогол\w*|пав|наркот\w*|психоактивн\w*\s+веществ\w*)', polarity: neg_only}
    - {re: '\bалкогол\w*|\bпав\b|наркотик\w*|наркотическ\w*\s+веществ\w*|психоактивн\w*\s+веществ\w*|вредн\w*\s+привычк\w*', polarity: neg_only}
  lactose_intolerance: []
  hypersensitivity_aviandr:
    - {re: '(?:гиперчувствительност\w*|непереносимост\w*|аллерги\w*|аллергическ\w*\s+реакци\w*|реакци\w*)\s+(?:(?:к|на)\s+)?(?:компонент\w*\s+)?(?:препарат\w*\s+)?авиандр\w*', polarity: both}

# Упоминание ингибиторов МАО как класса: отрицание → maoi_within_2_weeks = false;
# утверждение считается только вместе с глаголом приёма («принимает иМАО»).
maoi_class: 'ингибитор\w*\s+(?:мао|моноаминоксидаз\w*)(?:-?[abаб]\b)?|\bимао\b|\bмао-?\s*ингибитор\w*'
intake_verbs: '\bпринима\w*|\bполуча\w*'

# --- Препараты ------------------------------------------------------------------------------------
# names — МНН и торговые наименования (именительный падеж; окончания до 3 букв допускаются).
# Многозначные слова (Портал, Когнитив, Ангедон, Торин) не включены намеренно.
medications:
  # СИОЗС
  - {mnn: сертралин, group: ssri, names: [сертралин, золофт, асентра, стимулотон, серлифт, депрефолт, алевал, серената]}
  - {mnn: пароксетин, group: ssri, names: [пароксетин, паксил, рексетин, адепресс, плизил, актапароксетин]}
  - {mnn: флуоксетин, group: ssri, names: [флуоксетин, прозак, профлузак, фрамекс, продеп]}
  - {mnn: эсциталопрам, group: ssri, names: [эсциталопрам, ципралекс, селектра, элицея, ленуксин]}
  - {mnn: циталопрам, group: ssri, names: [циталопрам, ципрамил, сиозам, опра]}
  - {mnn: флувоксамин, group: ssri, names: [флувоксамин, феварин]}
  # СИОЗСН
  - {mnn: венлафаксин, group: snri, names: [венлафаксин, велаксин, венлаксор, эфевелон, велафакс, ньювелонг]}
  - {mnn: дулоксетин, group: snri, names: [дулоксетин, симбалта, интрива, дулоксента]}
  - {mnn: милнаципран, group: snri, names: [милнаципран, иксел]}
  # ТЦА
  - {mnn: амитриптилин, group: tca, names: [амитриптилин, саротен]}
  - {mnn: кломипрамин, group: tca, names: [кломипрамин, анафранил]}
  - {mnn: имипрамин, group: tca, names: [имипрамин, мелипрамин]}
  # Другие антидепрессанты
  - {mnn: миртазапин, group: other_ad, names: [миртазапин, ремерон, миртазонал, каликста]}
  - {mnn: агомелатин, group: other_ad, names: [агомелатин, вальдоксан, агомеланн]}
  - {mnn: вортиоксетин, group: other_ad, names: [вортиоксетин, бринтелликс]}
  - {mnn: тразодон, group: other_ad, names: [тразодон, триттико]}
  - {mnn: тианептин, group: other_ad, names: [тианептин, коаксил]}
  - {mnn: миансерин, group: other_ad, names: [миансерин, леривон]}
  - {mnn: бупропион, group: other_ad, names: [бупропион]}
  # Ингибиторы МАО
  - {mnn: моклобемид, group: maoi, names: [моклобемид, аурорикс]}
  - {mnn: пирлиндол, group: maoi, names: [пирлиндол, пиразидол]}
  - {mnn: селегилин, group: maoi, names: [селегилин, юмекс]}
  - {mnn: разагилин, group: maoi, names: [разагилин, азилект]}
  # Раздел взаимодействий карточки Авиандра
  - {mnn: трамадол, group: interaction, names: [трамадол, трамал, залдиар]}
  - {mnn: тримеперидин, group: interaction, names: [тримеперидин, промедол]}
  - {mnn: дифенгидрамин, group: interaction, names: [дифенгидрамин, димедрол]}
  - {mnn: кетоконазол, group: interaction, names: [кетоконазол, низорал]}
  - {mnn: хинидин, group: interaction, names: [хинидин]}
  - {mnn: гидроксихлорохин, group: interaction, names: [гидроксихлорохин, плаквенил, иммард]}
  - {mnn: суматриптан, group: interaction, names: [суматриптан, имигран, амигренин, сумамигрен]}
  # Анксиолитики
  - {mnn: гидроксизин, group: anx, names: [гидроксизин, атаракс]}
  - {mnn: тофизопам, group: anx, names: [тофизопам, грандаксин]}
  - {mnn: фабомотизол, group: anx, names: [фабомотизол, афобазол]}
  - {mnn: алпразолам, group: anx, names: [алпразолам, ксанакс, золомакс, хелекс]}
  - {mnn: бромдигидрохлорфенилбензодиазепин, group: anx, names: [бромдигидрохлорфенилбензодиазепин, феназепам, фензитат, элзепам, транквезипам]}
  - {mnn: диазепам, group: anx, names: [диазепам, реланиум, сибазон, седуксен, валиум]}
  - {mnn: лоразепам, group: anx, names: [лоразепам, лорафен]}
  - {mnn: клоназепам, group: anx, names: [клоназепам, ривотрил]}
  - {mnn: этифоксин, group: anx, names: [этифоксин, стрезам]}
  - {mnn: мебикар, group: anx, names: [мебикар, адаптол]}
  # Сам препарат (МНН в карточке не указано — канонический ключ по торговому названию)
  - {mnn: авиандр, group: aviandr, names: [авиандр]}

# Статус назначения: признаки отмены и продолжения в пределах пункта назначения
cancel_triggers: 'отмен\w*|\bотм\.|\bранее\b|\bпрежде\b|прекращ\w*|прекратил\w*|в\s+прошлом|\bдо\s+\d{1,2}\.\d{1,2}|замен[её]н\w*|\bснят\w*|перестал\w*|бросил\w*|\bпринимал\w*|\bполучал\w*'
current_triggers: 'продолж\w*|возобнов\w*'
dose: '(\d+(?:[.,]\d+)?)\s*(мг|mg|мкг|mcg|г)(?![а-яa-z])'

# --- Аллергии ------------------------------------------------------------------------------------
# Препараты из словаря выше в контексте аллергии тоже считаются аллергенами (по МНН).
allergens:
  - {name: пенициллин, re: 'пенициллин\w*'}
  - {name: амоксициллин, re: 'амоксициллин\w*|амоксиклав\w*|флемоксин\w*'}
  - {name: цефтриаксон, re: 'цефтриаксон\w*'}
  - {name: цефалоспорины, re: 'цефалоспорин\w*'}
  - {name: сульфаниламиды, re: 'сульфаниламид\w*|бисептол\w*|ко-тримоксазол\w*'}
  - {name: прокаин, re: 'прокаин\w*|новокаин\w*'}
  - {name: лидокаин, re: 'лидокаин\w*'}
  - {name: ацетилсалициловая кислота, re: 'ацетилсалицилов\w*\s+кислот\w*|аспирин\w*|\bаск\b'}
  - {name: метамизол натрия, re: 'метамизол\w*(?:\s+натри\w*)?|анальгин\w*|баралгин\w*'}
  - {name: ибупрофен, re: 'ибупрофен\w*|нурофен\w*'}
  - {name: йод, re: '\bйод\w{0,3}\b|йодсодержащ\w*'}
# Слова аллергологического анамнеза. denial — их отрицание означает «аллергию отрицает».
allergy_denial_terms: 'аллерг\w*(?:\s+(?:анамнез|реакци)\w*)?|аллергоанамнез\w*|лекарственн\w*\s+непереносимост\w*|непереносимост\w*\s+(?:лекарств|препарат|медикамент)\w*'
allergy_context_terms: 'непереносимост\w*|гиперчувствительност\w*|реакци\w*\s+на'
# Между аллергенами в перечне допустимы только эти слова (и скобки)
allergy_list_glue: '(?:и|или|на|к|а\s+также|также|препарат\w*|лекарств\w*|антибиотик\w*|групп\w*|ряда|в\s+виде|крапивниц\w*|сып\w*|зуд\w*|от[её]к\w*|квинке|анафилакс\w*|анафилактическ\w*|шок\w*|бронхоспазм\w*|высыпани\w*|покраснени\w*|реакци\w*)'
# Содержимое раздела «аллергологический анамнез», означающее отказ от аллергии
allergy_section_denial: '^\s*(?:не\s+отягощ\w*|не\s+отяг\.?|нет\b|отрица\w*|отриц\.|не\s+выявлен\w*|без\s+особенностей)'

# --- Отрицание, сомнение, условие, чужой анамнез --------------------------------------------------
negation:
  # после термина: «эпилепсию отрицает», «Б-сть: нет», «грудью не кормит»
  post: '\bотрица\w*|\bотриц\.|\bотр\.|\bнет\b|\bне\s+(?:был|была|было|были)\b|\bне\s+(?:страда|отмеча|наблюда|выявл|обнаруж|диагностир|регистрир|выставля|принима|получа|назнача|корм|осуществля|злоупотребля|употребля|отягощ|отяг|подтвержд|определя|прослежива)\w*\.?|\bотсутству\w*|\bисключен\w*|\bисключ\.|\bв\s+норме\b|\bв\s+пределах\s+(?:возрастной\s+)?нормы|\bнорма\b|\bсохранн?\w*|\bне\s+нарушен\w*|\bбез\s+(?:особенностей|патологии|изменений)'
  # перед перечнем: «отрицает эпилепсию, ЧМТ»
  pre_list: '\bотрица\w*(?:\s+наличие)?|\bнет\s+данных\s+(?:за|о)\b|\bисключен\w*\s*:|\bотсутству\w*'
  # непосредственно перед термином: «не беременна», «нет эпилепсии», «без признаков …»
  pre_tight: '\b(?:не|нет|без)\b'
  # похожее на отрицание, но это сомнение: «беременность не исключена»
  pseudo: '\bне\s+исключ\w*\.?|\bнельзя\s+исключ\w*|\bне\s+уточн\w*'
uncertainty: '\bпод\s+вопросом|\bподозрени\w*|\bвероятн\w*|\bвозможн\w*|\bпредположительн\w*|\bсомнительн\w*'
preliminary: '\bпредварительн\w*|\bпредв\.'
sublabel_reset: '(?:сопутств\w*|сопут\.|осложнени\w*|фонов\w*)\s*(?:заболевани\w*\s*)?:'
hypothetical: '\bпри\s+(?:планировани|наступлени|появлени|возникновени|развити|выявлени|подтверждени|необходимост|ухудшени|повышени|снижени)\w*|\bпри\s*$|\bв\s+случае\b|\bесли\b|\bпланир\w*|\bконтрол\w*|\bмониторинг\w*|\bисключить\b|\bдля\s+исключени\w*|\bтест\w*\s+на\b|\bобследовани\w*\s+на\b|\bриск\w*\s+развити\w*'
family_clause: '\bнаследственн\w*|\bнаследств\.|\bсемейн\w*\s+анамнез\w*'
family_segment: '\bу\s+(?:матери|мамы|отца|папы|брата|сестры|бабушки|дедушки|деда|дяди|тети|сына|дочери|родственник\w*|родител\w*)\b|\b(?:мать|отец|брат|сестра|бабушка|дедушка|дед|дядя|тетя|родственник\w*|родител\w*)\b'
# «Беременностей 2», «в анамнезе 2 беременности» — акушерский анамнез, а не текущая беременность
pregnancy_history: '^\s*[-—–:]?\s*\d+(?!\s*(?:нед|мес|-?\s*й\b|\d))'

# --- Даты ----------------------------------------------------------------------------------------
months: [январ, феврал, март, апрел, ма, июн, июл, август, сентябр, октябр, ноябр, декабр]
# Единицы срока «… назад» в днях
ago_units: {день: 1, дн: 1, сут: 1, недел: 7, нед: 7, месяц: 30, мес: 30, год: 365, лет: 365}
ago_numbers: {один: 1, одну: 1, одна: 1, два: 2, две: 2, три: 3, четыре: 4, пять: 5, шесть: 6, семь: 7,
              восемь: 8, девять: 9, десять: 10, полтора: 1.5, полторы: 1.5, пол: 0.5}
# «несколько недель назад» намеренно не переводится в число: срок неизвестен → null
