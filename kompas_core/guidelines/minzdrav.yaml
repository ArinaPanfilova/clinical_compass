# Варианты терапии — справочно по действующим клиническим рекомендациям Минздрава России.
# Это справка для врача, а не назначение: система не выбирает препарат.
#
# Источник текста — рубрикатор cr.minzdrav.gov.ru (полный текст КР 457_3 и 301_3), сверено 26.10.2026.
# drugs[].indication — есть ли показание в инструкции по медицинскому применению. Сверено по vidal.ru
# (вспомогательный источник), кроме маритупирдина — сверен с листком-вкладышем ГРЛС. До апробации каждую
# отметку сверить с ГРЛС. off_label: true — показания нет («#» в КР или нет в инструкциях): применение вне
# инструкции — только решение врача, система такой вариант не предлагает.
# УУР — уровень убедительности рекомендации, УДД — уровень достоверности доказательств (как в КР).

- id: "457_3"
  title: "Генерализованное тревожное расстройство"
  icd10: ["F41.1"]
  year: 2024
  status: "Применяется (рубрикатор Минздрава, опубликовано 19.09.2024)"
  developer: "Российское общество психиатров"
  url: "https://cr.minzdrav.gov.ru/preview-cr/457_3"
  monitoring: >
    Эффективность и переносимость — на 7, 14 и 28 день, далее раз в 4 недели (УУР C, УДД 5).
    Нет эффекта монотерапии через 4–6 недель — смена препарата или комбинация. После наступления эффекта
    терапия не менее 6 месяцев (УУР C, УДД 5); отменять постепенно (УУР B, УДД 2).
  options:
    - label: "Психофармакотерапия и/или психотерапия"
      kind: approach
      line: first
      drugs: []
      evidence: "УУР A, УДД 1"
      note: "Выбор и сочетание методов — индивидуально; сочетание высокоэффективно."
      source: "КР ГТР 2024, раздел 3.1"
    - label: "СИОЗС"
      kind: drug_class
      line: first
      drugs:
        - {mnn: "пароксетин", indication: "есть"}
        - {mnn: "эсциталопрам", indication: "есть у части препаратов"}
        - {mnn: "сертралин", indication: "нет (в КР «#»)", off_label: true}
      evidence: "УУР A, УДД 1"
      note: "Первый курс — монотерапия 4–6 недель; анксиолитический эффект через 2–8 недель. В первые недели — контроль суицидального риска и усиления тревоги."
      source: "КР ГТР 2024, раздел 3.2, терапия первой линии"
    - label: "СИОЗСН"
      kind: drug_class
      line: first
      drugs:
        - {mnn: "дулоксетин", indication: "есть"}
        - {mnn: "венлафаксин", indication: "есть у отдельных препаратов (в КР «#»)"}
      evidence: "УУР A, УДД 1"
      note: "У большинства препаратов венлафаксина показания ГТР нет — проверяйте инструкцию конкретного препарата."
      source: "КР ГТР 2024, раздел 3.2, терапия первой линии"
    - label: "Агомелатин"
      kind: drug_class
      line: first
      drugs:
        - {mnn: "агомелатин", indication: "нет в инструкциях (только депрессия) — расхождение с КР, сверить с ГРЛС", off_label: true}
      evidence: "УУР A, УДД 1"
      note: "В КР — первая линия; в инструкциях показания ГТР не найдено."
      source: "КР ГТР 2024, раздел 3.2, терапия первой линии"
    - label: "Бензодиазепины — коротким курсом"
      kind: drug_class
      line: adjunct
      drugs:
        - {mnn: "алпразолам", indication: "общая формулировка («тревожные состояния»)"}
        - {mnn: "диазепам", indication: "общая формулировка"}
        - {mnn: "бромдигидрохлорфенилбензодиазепин", indication: "общая формулировка"}
      evidence: "УУР A, УДД 1"
      note: "При выраженной тревоге на первом этапе, курс не более 4 недель. Нецелесообразны при зависимости или риске зависимости от ПАВ, не рекомендуются пожилым (падения); отмена постепенная."
      source: "КР ГТР 2024, раздел 3.2"
    - label: "Психотерапия, прежде всего КПТ"
      kind: psychotherapy
      line: first
      drugs: []
      evidence: "КПТ — УУР A, УДД 1; психотерапия с фармакотерапией — УУР B, УДД 1"
      note: "Индивидуально, в группе или онлайн. При лёгкой симптоматике возможна без препаратов. Также: краткосрочная психодинамическая (A/1), динамическая личностно-ориентированная (B/2)."
      source: "КР ГТР 2024, раздел 3.3"
    - label: "Прегабалин (монотерапия)"
      kind: drug_class
      line: second
      drugs:
        - {mnn: "прегабалин", indication: "есть"}
      evidence: "УУР A, УДД 1"
      note: "Когда преобладают соматические проявления тревоги. Не назначать при зависимости от ПАВ или склонности к ней."
      source: "КР ГТР 2024, раздел 3.2, терапия второй линии"
    - label: "Проверка приверженности, максимальная доза, смена антидепрессанта"
      kind: approach
      line: second
      drugs: []
      evidence: "приверженность — УУР C, УДД 3; максимальная доза при частичном ответе — УУР B, УДД 2"
      note: "Перед сменой схемы — проверить, принимает ли пациент препарат (см. приверженность в карточке)."
      source: "КР ГТР 2024, раздел 3.2, терапия второй линии"
    - label: "Анксиолитики при недостаточном эффекте первых двух линий"
      kind: drug_class
      line: third
      drugs:
        - {mnn: "гидроксизин", indication: "есть"}
        - {mnn: "буспирон", indication: "есть"}
        - {mnn: "маритупирдин", trade_names: ["авиандр"], indication: "есть (ГРЛС, ЛП-№(002445)-(РГ-RU))"}
      evidence: "гидроксизин — УУР A, УДД 1; буспирон — УУР B, УДД 2; маритупирдин — УУР B, УДД 2"
      note: "Маритупирдин (Авиандр): эффект показан в одном плацебо-контролируемом РКИ, длительные эффекты не изучены. В КР действующее вещество записано как «маритупердин»."
      source: "КР ГТР 2024, раздел 3.2, терапия третьей линии"
    - label: "Фабомотизол и другие средства при резистентности"
      kind: drug_class
      line: fourth
      drugs:
        - {mnn: "фабомотизол", indication: "есть"}
        - {mnn: "этифоксин", indication: "общая формулировка (в КР «#»)", off_label: true}
      evidence: "фабомотизол — УУР C, УДД 2"
      note: "Четвёртая линия также включает антипсихотики и другие антидепрессанты — в основном вне зарегистрированного показания (решение психиатра)."
      source: "КР ГТР 2024, раздел 3.2, терапия четвёртой линии"
    - label: "ТМС, биологическая обратная связь"
      kind: approach
      line: adjunct
      drugs: []
      evidence: "ТМС — УУР B, УДД 2; БОС — УУР C, УДД 5"
      note: "При рефрактерности к фармако- и психотерапии."
      source: "КР ГТР 2024, раздел 3.4"

- id: "301_3"
  title: "Депрессивный эпизод, рекуррентное депрессивное расстройство"
  icd10: ["F32", "F33"]
  year: 2024
  status: "Применяется (рубрикатор Минздрава, опубликовано 26.08.2024)"
  developer: "Российское общество психиатров"
  url: "https://cr.minzdrav.gov.ru/preview-cr/301_3"
  monitoring: >
    В острой фазе — наблюдение не реже раза в неделю: суицидальный риск, ответ, переносимость, приверженность.
    Эффект обычно через 3–4 недели (на СИОЗС — к 4–6, иногда к 8 неделе). Нет эффекта или редукция 25–50 % за
    3–4 недели — максимальная доза или смена антидепрессанта. Стабилизирующая терапия — 4–6 месяцев
    (УУР A, УДД 1); при рекуррентном расстройстве — противорецидивная не менее 3–5 лет (УУР A, УДД 2).
  options:
    - label: "Лёгкий эпизод: СИОЗС и антидепрессанты новых поколений"
      kind: drug_class
      line: first
      drugs:
        - {mnn: "агомелатин", indication: "есть"}
        - {mnn: "вортиоксетин", indication: "есть"}
      evidence: "УУР A, УДД 1"
      note: "В ряде случаев достаточно психотерапии, психообразования, социальной реабилитации."
      source: "КР ДЭ/РДР 2024, раздел 3.1.1"
    - label: "Умеренный эпизод: СИОЗС, СИОЗСН, миртазапин, агомелатин, вортиоксетин"
      kind: drug_class
      line: first
      drugs:
        - {mnn: "сертралин", indication: "есть"}
        - {mnn: "эсциталопрам", indication: "есть"}
        - {mnn: "пароксетин", indication: "есть"}
        - {mnn: "флуоксетин", indication: "есть"}
        - {mnn: "венлафаксин", indication: "есть"}
        - {mnn: "дулоксетин", indication: "есть"}
        - {mnn: "миртазапин", indication: "есть"}
      evidence: "УУР A, УДД 1"
      note: "По возможности добавлять психотерапию. Агомелатин — печёночные пробы в начале и при повышении дозы."
      source: "КР ДЭ/РДР 2024, раздел 3.1.2; приложение А3"
    - label: "Тяжёлый эпизод без психотических симптомов: СИОЗСН, миртазапин, ТЦА"
      kind: drug_class
      line: first
      drugs:
        - {mnn: "венлафаксин", indication: "есть"}
        - {mnn: "дулоксетин", indication: "есть"}
        - {mnn: "миртазапин", indication: "есть"}
        - {mnn: "амитриптилин", indication: "есть"}
      evidence: "УУР A, УДД 1; при высоком суицидальном риске — стационар, рассмотреть ЭСТ (УУР B, УДД 1)"
      note: "Тяжёлый эпизод и эпизод с психотическими симптомами — ведение психиатром."
      source: "КР ДЭ/РДР 2024, разделы 3.1.3–3.1.4"
    - label: "Психотерапия в сочетании с фармакотерапией, прежде всего КПТ"
      kind: psychotherapy
      line: first
      drugs: []
      evidence: "психотерапия — УУР A, УДД 1; КПТ — УУР A, УДД 1"
      note: "Также ИПТ (B/2), психодинамическая (B/1), MBCT и ACT (B/1). При тяжёлой депрессии на первых этапах, как правило, неэффективна."
      source: "КР ДЭ/РДР 2024, раздел 3.7"
    - label: "Второй этап: максимальная доза или смена антидепрессанта"
      kind: approach
      line: second
      drugs: []
      evidence: "УУР A, УДД 1"
      note: "Если за 3–4 недели нет эффекта или редукция лишь 25–50 %."
      source: "КР ДЭ/РДР 2024, раздел 3.2"
    - label: "Комбинации и аугментация — решение психиатра"
      kind: approach
      line: third
      drugs: []
      evidence: "комбинации антидепрессантов — УУР A, УДД 1"
      note: "Большинство препаратов аугментации применяется вне зарегистрированного показания («#» в КР)."
      source: "КР ДЭ/РДР 2024, раздел 3.3"
    - label: "Психообразование для пациента и родственников"
      kind: approach
      line: adjunct
      drugs: []
      evidence: "УУР C, УДД 5"
      note: "Цель — приверженность лечению и союз врача, пациента и семьи."
      source: "КР ДЭ/РДР 2024, раздел 4"
    - label: "Нелекарственные методы в дополнение к антидепрессантам"
      kind: approach
      line: adjunct
      drugs: []
      evidence: "физические упражнения — УУР B, УДД 1; светотерапия — УУР B, УДД 1"
      note: "Не замена антидепрессанту при умеренном и тяжёлом эпизоде."
      source: "КР ДЭ/РДР 2024, раздел 3.7"
