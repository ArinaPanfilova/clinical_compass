# Система дозу не рассчитывает и не предлагает изменить. Текст показывается врачу.
dosing_text: >
  По 20 мг (1 таблетка) 2 раза в сутки, утром и вечером, внутрь за 30 минут до еды.
  ГТР — длительность определяет врач. Состояния после COVID-19 — курс 4 недели,
  по решению врача до 6 недель. (Вторичный источник — сверить с ГРЛС.)

evidence:
  - "Двойное слепое плацебо-контролируемое исследование эффективности и переносимости препарата Авиандр при ГТР. Современная терапия психических расстройств. 2024 (n=160; 8 нед.) — не замена инструкции"
