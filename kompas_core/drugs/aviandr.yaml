# Система дозу не рассчитывает и не предлагает изменить. Текст показывается врачу.
dosing_text: >
  По 20 мг (1 таблетка) 2 раза в сутки, утром и вечером, внутрь за 30 минут до еды, не разжёвывая.
  ГТР — длительность определяет врач. Тревожные состояния после COVID-19 — курс 4 недели,
  по рекомендации врача до 6 недель. (Листок-вкладыш ГРЛС от 29.07.2026.)

# «Немедленно сообщите врачу» (листок-вкладыш, раздел 4) — кандидаты в правило срочного НЯ.
